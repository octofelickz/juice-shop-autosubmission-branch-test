
name: Component Detection

on:
  workflow_dispatch:
  push:

permissions:
  id-token: write
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: npm install --package-lock=true
      - name: Component detection
        uses: advanced-security/component-detection-dependency-submission-action@felickz-fix-npm-snapshot-manifests
